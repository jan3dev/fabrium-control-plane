[workspace]
members = [".", "migration"]

[package]
name = "fabrium-control-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
# The SDK defaults pull in aws-lc and a second TLS stack. The tree already builds rustls with ring.
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-ec2 = { version = "1.271.0", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = ["rustls-ring"] }
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
migration = { path = "migration" }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Replays canned EC2 responses, so the adapter is tested without network or credentials.
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = ["test-util"] }
aws-smithy-types = "1.9.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
